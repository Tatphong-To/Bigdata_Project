x-airflow-common: &airflow-common
  image: apache/airflow:2.10.3-python3.12
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://food_user:food_pass@postgres:5432/airflow_db
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Fernet key for connection/variable encryption — replace in production
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # food_db connection reachable from DAG code as conn id "food_db"
    AIRFLOW_CONN_FOOD_DB: postgresql://food_user:food_pass@postgres:5432/food_db
    # Spoonacular key is injected from the host .env (never committed)
    SPOONACULAR_API_KEY: ${SPOONACULAR_API_KEY:-}
    # Daily quota in POINTS (not requests). Conservative default until the
    # account console value is confirmed — see docs/spoonacular-quota.md
    SPOONACULAR_DAILY_POINT_QUOTA: ${SPOONACULAR_DAILY_POINT_QUOTA:-50}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./model_service:/opt/airflow/model_service
    - ./data:/opt/airflow/data
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: food_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: food_user
      POSTGRES_PASSWORD: food_pass      # เปลี่ยนใน production
      POSTGRES_MULTIPLE_DATABASES: food_db,airflow_db,mlflow_db
    ports:
      # host port is configurable to avoid clashing with another local Postgres
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-multi-db.sh:/docker-entrypoint-initdb.d/00-init-multi-db.sh
      - ./infra/postgres/food_db_schema.sql:/docker-entrypoint-initdb.d/10-food_db_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    container_name: food_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname admin --lastname admin \
          --role Admin --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: food_airflow_webserver
    restart: unless-stopped
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: food_airflow_scheduler
    restart: unless-stopped
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: food_mlflow
    restart: unless-stopped
    # the base mlflow image ships without a Postgres driver — install it first
    command: >
      bash -c "pip install --no-cache-dir psycopg2-binary &&
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql+psycopg2://food_user:food_pass@postgres:5432/mlflow_db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  airflow_logs:
  mlflow_artifacts:
